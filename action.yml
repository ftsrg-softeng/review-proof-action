name: 'review-proof'
description: 'Posts an encoded proof string to a pull request once it has a finished review.'
inputs:
  github-token:
    description: 'Token with pull-requests read/write permission.'
    required: true
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Check for a finished review
      id: review
      shell: bash
      run: |
        set -euo pipefail
        pr_number="${{ github.event.pull_request.number }}"
        if [ -z "$pr_number" ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        reviews=$(curl -sf \
          -H "Authorization: Bearer ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/pulls/${pr_number}/reviews")
        finished=$(printf '%s' "$reviews" | jq '[.[] | select(.state != "PENDING")] | length')
        echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
        if [ "$finished" -gt 0 ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Produce and post proof
      if: steps.review.outputs.found == 'true'
      shell: bash
      run: |
        set -euo pipefail
        chmod +x "${{ github.action_path }}/bin/review-proof"
        proof=$("${{ github.action_path }}/bin/review-proof")
        body=$(jq -n --arg body "$proof" '{body: $body}')
        curl -sf -X POST \
          -H "Authorization: Bearer ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github+json" \
          -d "$body" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.review.outputs.pr-number }}/comments" \
          > /dev/null
